<!-- @dsCard group="Components" viewport="700x620" name="Badge, Indicator, Chip & ActionButton" subtitle="Product status pills, status lights, and the marketing chip / badge / CTA lockups" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{padding:20px 24px;font-family:var(--font-body);background:var(--bg-default);color:var(--text-body)}
.k{font-family:var(--font-mono);font-size:10px;line-height:14px;color:var(--text-tertiary)}
.lb{font-family:var(--font-mono);font-size:10px;line-height:14px;color:var(--text-tertiary);width:64px;flex-shrink:0}
.rule{height:1px;background:var(--border-muted);margin:4px 0}
.sec{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary)}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Badge, Indicator, Chip, ActionButton } = window.FaclonLabsDesignSystem_4d0fff;
const colors = ['primary','positive','negative','notice','information','neutral'];
function Card(){
  return (<div style={{display:'flex',flexDirection:'column',gap:14}}>
    <span className="sec">Product — Badge</span>
    {['subtle','intense'].map(em => (
      <div key={em} style={{display:'flex',flexDirection:'column',gap:7}}>
        <div className="k">emphasis = {em}</div>
        {['small','medium','large'].map(sz => (
          <div key={sz} style={{display:'flex',alignItems:'center',gap:8}}>
            <span className="lb">{sz}</span>
            {colors.map(c => <Badge key={c} color={c} size={sz} emphasis={em}>Label</Badge>)}
          </div>
        ))}
      </div>
    ))}
    <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
      <span className="lb">Indicator</span>
      <Indicator intent="positive">Active</Indicator>
      <Indicator intent="negative">Failed</Indicator>
      <Indicator intent="notice">Pending</Indicator>
      <Indicator intent="information">Syncing</Indicator>
      <Indicator intent="neutral">Draft</Indicator>
      <Indicator intent="positive" showLabel={false} />
    </div>

    <div className="rule"></div>
    <span className="sec">Marketing lockups</span>

    <div style={{display:'flex',alignItems:'center',gap:16}}>
      <span className="lb">Chip</span>
      <Chip>Industry 4.0 in a box</Chip>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:16}}>
      <span className="lb">Badge<br/>shadow</span>
      <Chip shape="pill" shadow size="small">rishi.sharma@faclon.com | +1 (929) 220-3610</Chip>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:16}}>
      <span className="lb">Badge<br/>flat</span>
      <Chip shape="pill" size="small">rishi.sharma@faclon.com | +1 (929) 220-3610</Chip>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:16}}>
      <span className="lb">Button<br/>+ icon</span>
      <ActionButton>Book a Demo</ActionButton>
      <ActionButton shadow={false} icon={null}>Learn more</ActionButton>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
