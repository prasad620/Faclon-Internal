<!-- @dsCard group="Styles" viewport="700x130" name="Border width" subtitle="thinner → thicker" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--surface-card);color:var(--text-normal)}</style></head><body>
<div style="display:flex;gap:20px">
<div style="text-align:center"><div style="width:96px;height:48px;border-radius:8px;border:0 solid rgb(108,132,157)"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono)">none<br>0</div></div><div style="text-align:center"><div style="width:96px;height:48px;border-radius:8px;border:0.5px solid rgb(108,132,157)"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono)">thinner<br>0.5px</div></div><div style="text-align:center"><div style="width:96px;height:48px;border-radius:8px;border:1px solid rgb(108,132,157)"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono)">thin<br>1px</div></div><div style="text-align:center"><div style="width:96px;height:48px;border-radius:8px;border:1.5px solid rgb(108,132,157)"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono)">thick<br>1.5px</div></div><div style="text-align:center"><div style="width:96px;height:48px;border-radius:8px;border:2px solid rgb(108,132,157)"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono)">thicker<br>2px</div></div>
</div>
</body></html>
