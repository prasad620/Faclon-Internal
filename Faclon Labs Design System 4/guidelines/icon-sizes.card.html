<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--surface-card);color:var(--text-normal)}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:24px">
<div style="text-align:center"><div style="width:8px;height:8px;border-radius:2px;background:var(--icon-normal);margin:0 auto"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:8px;font-family:var(--font-mono)">xsmall<br>8px</div></div><div style="text-align:center"><div style="width:12px;height:12px;border-radius:2px;background:var(--icon-normal);margin:0 auto"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:8px;font-family:var(--font-mono)">small<br>12px</div></div><div style="text-align:center"><div style="width:16px;height:16px;border-radius:2px;background:var(--icon-normal);margin:0 auto"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:8px;font-family:var(--font-mono)">medium<br>16px</div></div><div style="text-align:center"><div style="width:20px;height:20px;border-radius:2px;background:var(--icon-normal);margin:0 auto"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:8px;font-family:var(--font-mono)">large<br>20px</div></div><div style="text-align:center"><div style="width:24px;height:24px;border-radius:2px;background:var(--icon-normal);margin:0 auto"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:8px;font-family:var(--font-mono)">xlarge<br>24px</div></div><div style="text-align:center"><div style="width:32px;height:32px;border-radius:2px;background:var(--icon-normal);margin:0 auto"></div><div style="font-size:10px;line-height:14px;color:var(--text-muted);margin-top:8px;font-family:var(--font-mono)">2xlarge<br>32px</div></div>
</div>
