<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--surface-card);color:var(--text-normal)}</style><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Spacer, SpacerBase, SectionDivider } = window.FaclonLabsDesignSystem_4d0fff;
const Box = ({children}) => <div style={{background:'rgba(48,94,255,0.09)',color:'var(--brand-primary)',fontFamily:'var(--font-mono)',fontSize:11,padding:'6px 10px',borderRadius:4}}>{children}</div>;
function Card(){
  return (<div>
    <div style={{display:'flex',alignItems:'center'}}>
      <Box>A</Box><Spacer size="03" direction="horizontal"/><Box>03 · 8px</Box>
      <Spacer size="07" direction="horizontal"/><Box>07 · 24px</Box>
      <Spacer size="10" direction="horizontal"/><Box>10 · 48px</Box>
    </div>
    <Spacer size="07"/>
    <SectionDivider/>
    <Spacer size="05"/>
    <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-muted)'}}>SectionDivider · thick (2px)</div>
    <Spacer size="05"/>
    <SectionDivider weight="thin"/>
    <Spacer size="03"/>
    <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-muted)'}}>SectionDivider · thin (1px)</div>
    <Spacer size="06"/>
    <div style={{display:'flex',alignItems:'flex-end',gap:10}}>{['01','02','03','04','05','06','07','08','09','10','11'].map(s => <SpacerBase key={s} spacer={s} visualise/>)}</div>
    <Spacer size="02"/>
    <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-muted)'}}>SpacerBase · 12 steps</div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
