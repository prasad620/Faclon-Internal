<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../../styles.css">

<div class="g">
<div><div class="t"><img src="../svg/AutomobileProperty1Eicher.svg" alt="Automobile"></div><div class="c">Automobile</div><div class="v">4 variants</div></div>

<div><div class="t"><img src="../svg/EnegrgyProperty1IndianOIL.svg" alt="Enegrgy"></div><div class="c">Enegrgy</div><div class="v">5 variants</div></div>
<div><div class="t"><img src="../svg/MetalsProperty1Tata.svg" alt="Metals"></div><div class="c">Metals</div><div class="v">3 variants</div></div>
<div><div class="t"><img src="../svg/OEMProperty1KSB.svg" alt="OEM"></div><div class="c">OEM</div><div class="v">2 variants</div></div>
<div><div class="t"><img src="../svg/PharmaProperty1Mainkind.svg" alt="Pharma"></div><div class="c">Pharma</div><div class="v">2 variants</div></div>

</body></html>
