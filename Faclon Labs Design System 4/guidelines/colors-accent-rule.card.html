<!-- @dsCard group="Colors" viewport="700x200" name="Accent — the 10% rule" subtitle="neon-lime never exceeds 10% of a composition" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{padding:20px 24px;font-family:var(--font-body);background:var(--surface-card);color:var(--text-normal)}.k{font-family:var(--font-mono);font-size:10px;line-height:14px;color:var(--neutral-light-500)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;height:34px;border-radius:4px;overflow:hidden">
<div style="flex:60;background:var(--neutral-light-100)"></div>
<div style="flex:30;background:var(--azure-brand)"></div>
<div style="flex:10;background:var(--neon-lime)"></div>
</div>
<div style="display:flex;font-size:10px;line-height:14px;color:var(--neutral-light-600)">
<span style="flex:60">Neutral · ~60%</span><span style="flex:30">Brand azure · ~30%</span><span style="flex:10;text-align:right">Accent · ≤10%</span>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid var(--neutral-light-a100);padding-top:14px">
<div style="display:flex;flex-direction:column;gap:8px">
<div class="k">✓ One accent moment per view</div>
<div style="background:var(--neutral-light-050);border:1px solid var(--neutral-light-a100);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px">
<div style="height:7px;width:70%;background:var(--neutral-light-300);border-radius:2px"></div>
<div style="height:7px;width:90%;background:var(--neutral-light-200);border-radius:2px"></div>
<div style="display:flex;gap:6px;align-items:center"><span style="height:20px;padding:0 10px;display:inline-flex;align-items:center;background:var(--azure-brand);color:#fff;font-size:10px;border-radius:10px">Primary</span><span style="width:8px;height:8px;border-radius:50%;background:var(--neon-lime)"></span></div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<div class="k" style="color:var(--crimson-600)">✗ Accent as a surface</div>
<div style="background:var(--neon-lime);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px">
<div style="height:7px;width:70%;background:rgba(0,0,0,0.25);border-radius:2px"></div>
<div style="height:7px;width:90%;background:rgba(0,0,0,0.18);border-radius:2px"></div>
<div style="height:20px;width:64px;background:rgba(0,0,0,0.35);border-radius:10px"></div>
</div>
</div>
</div>
<div style="font-size:12px;line-height:18px;color:var(--neutral-light-600)">Accent is for emphasis — a highlight, a marker, a single call-out. Never a background, a large fill, or the dominant colour of a layout.</div>
</div>
</body></html>
