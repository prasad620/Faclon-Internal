<!-- @dsCard group="Colors" viewport="700x160" name="Semantic roles" subtitle="Text, surface and border aliases" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--surface-card);color:var(--text-normal)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:12px;line-height:18px">
<div><div style="height:40px;border-radius:8px;background:var(--surface-page);border:1px solid var(--surface-line)"></div><div style="margin-top:6px;color:var(--text-muted)">--surface-page</div></div>
<div><div style="height:40px;border-radius:8px;background:var(--surface-card);border:1px solid var(--surface-line)"></div><div style="margin-top:6px;color:var(--text-muted)">--surface-card</div></div>
<div><div style="height:40px;border-radius:8px;background:var(--surface-sunken);border:1px solid var(--surface-line)"></div><div style="margin-top:6px;color:var(--text-muted)">--surface-sunken</div></div>
<div style="color:var(--text-normal);font-weight:600">--text-normal</div>
<div style="color:var(--text-subtle);font-weight:600">--text-subtle</div>
<div style="color:var(--text-muted);font-weight:600">--text-muted</div>
</div>
</body></html>
