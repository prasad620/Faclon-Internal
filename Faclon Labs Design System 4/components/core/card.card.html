<!-- @dsCard group="Components" viewport="700x720" name="Card" subtitle="Every layout from the file, with-icon and without-icon — toggle light / dark" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--font-body);background:var(--bg-subtle);padding:18px 22px;transition:background var(--duration-moderate) var(--ease-standard)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.sec{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rule{height:1px;background:var(--border-muted);margin:18px 0}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Card, Indicator, ThemeToggle } = window.FaclonLabsDesignSystem_4d0fff;
const COPY = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.';
const M = <span/>;
function Gallery(){
  const [theme, setTheme] = React.useState('light');
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.classList.toggle('dark', theme === 'dark');
  }, [theme]);
  return (<div>
    <div className="bar">
      <span className="sec" style={{margin:0}}>Card layouts</span>
      <ThemeToggle options={['light','dark']} value={theme} onChange={setTheme} persist={false}/>
    </div>
    <p className="sec">With icon</p>
    <div className="grid">
      <Card media={M} title="Header" subtitle="sub-text comes here" body={COPY}/>
      <Card media={M} mediaPosition="trailing" title="Header" subtitle="sub-text comes here" body={COPY}/>
      <Card media={M} eyebrow="eyebrow text" title="Header" subtitle="sub-text comes here" body={COPY}/>
      <Card media={M} mediaPosition="trailing" eyebrow="eyebrow text" title="Header" subtitle="sub-text comes here" body={COPY}/>
      <Card media={M} mediaPosition="trailing" chip="Chip text comes here" title="Header" body={COPY}/>
      <Card media={M} title="Header" body={COPY}
            footer={<><Indicator intent="positive">Live</Indicator><Indicator intent="notice">Queued</Indicator></>}/>
    </div>
    <div className="rule"></div>
    <p className="sec">Without icon</p>
    <div className="grid">
      <Card media={null} title="Header" subtitle="sub-text comes here" body={COPY}/>
      <Card media={null} eyebrow="eyebrow text" title="Header" subtitle="sub-text comes here" body={COPY}/>
      <Card media={null} chip="Chip text comes here" title="Header" body={COPY}/>
      <Card media={null} eyebrow="eyebrow text" chip="Chip text comes here" title="Header" body={COPY}/>
      <Card media={null} title="Header" body={COPY}
            footer={<><Indicator intent="positive">Live</Indicator><Indicator intent="information">Syncing</Indicator></>}/>
      <Card media={null} chip="Chip text comes here" title="Header" body={COPY} elevation="low"
            footer={<Indicator intent="neutral">Draft</Indicator>}/>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Gallery/>);
</script></body></html>
