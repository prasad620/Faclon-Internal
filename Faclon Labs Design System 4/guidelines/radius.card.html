<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;font-family:var(--font-body);background:var(--bg-default)}</style></head><body>
<div style="display:flex;gap:20px">
<div style="text-align:center"><div style="width:88px;height:48px;border-radius:0px;background:rgba(108,132,157,0.12);box-shadow:inset 0 0 0 1.5px var(--border-muted)"></div><div style="font-size:10px;line-height:14px;color:var(--text-tertiary);margin-top:6px;font-family:var(--font-mono)">none<br>0px</div></div><div style="text-align:center"><div style="width:88px;height:48px;border-radius:1px;background:rgba(108,132,157,0.12);box-shadow:inset 0 0 0 1.5px var(--border-muted)"></div><div style="font-size:10px;line-height:14px;color:var(--text-tertiary);margin-top:6px;font-family:var(--font-mono)">xsmall<br>1px</div></div><div style="text-align:center"><div style="width:88px;height:48px;border-radius:2px;background:rgba(108,132,157,0.12);box-shadow:inset 0 0 0 1.5px var(--border-muted)"></div><div style="font-size:10px;line-height:14px;color:var(--text-tertiary);margin-top:6px;font-family:var(--font-mono)">small<br>2px</div></div><div style="text-align:center"><div style="width:88px;height:48px;border-radius:4px;background:rgba(108,132,157,0.12);box-shadow:inset 0 0 0 1.5px var(--border-muted)"></div><div style="font-size:10px;line-height:14px;color:var(--text-tertiary);margin-top:6px;font-family:var(--font-mono)">medium<br>4px</div></div><div style="text-align:center"><div style="width:88px;height:48px;border-radius:8px;background:rgba(108,132,157,0.12);box-shadow:inset 0 0 0 1.5px var(--border-muted)"></div><div style="font-size:10px;line-height:14px;color:var(--text-tertiary);margin-top:6px;font-family:var(--font-mono)">large<br>8px</div></div><div style="text-align:center"><div style="width:88px;height:48px;border-radius:10px;background:rgba(108,132,157,0.12);box-shadow:inset 0 0 0 1.5px var(--border-muted)"></div><div style="font-size:10px;line-height:14px;color:var(--text-tertiary);margin-top:6px;font-family:var(--font-mono)">max<br>10px</div></div>
</div>
</body></html>
