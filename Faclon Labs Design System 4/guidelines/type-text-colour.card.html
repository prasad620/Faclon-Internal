<!-- @dsCard group="Type" viewport="700x220" name="Text colour defaults" subtitle="Headers #0C1927, body #243547 — different by design" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{margin:0}body{padding:20px 24px;background:var(--bg-default)}.k{font-family:var(--font-mono);font-size:9px;line-height:13px;color:var(--text-tertiary)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
<div style="display:flex;flex-direction:column;gap:10px">
<span class="k">LIGHT THEME</span>
<div class="fl-heading-xl">Header — #0C1927</div>
<p class="fl-body-md" style="margin:0;max-width:300px">Body copy sits one step lighter at #243547. The contrast between the two is what gives a page its hierarchy before size even comes into play.</p>
<div style="display:flex;gap:8px;margin-top:2px"><span class="sw" style="width:34px;height:18px;border-radius:3px;background:var(--neutral-light-1300)"></span><span class="sw" style="width:34px;height:18px;border-radius:3px;background:var(--neutral-light-1100)"></span></div>
</div>
<div data-theme="dark" class="dark" style="display:flex;flex-direction:column;gap:10px;background:var(--bg-default);border-radius:8px;padding:16px;margin:-16px">
<span class="k">DARK THEME</span>
<div class="fl-heading-xl">Header — #F1F5FA</div>
<p class="fl-body-md" style="margin:0;max-width:300px">Body copy sits one step down at #CBD5E2, mirroring the light-theme relationship.</p>
<div style="display:flex;gap:8px;margin-top:2px"><span style="width:34px;height:18px;border-radius:3px;background:var(--neutral-light-100);display:inline-block"></span><span style="width:34px;height:18px;border-radius:3px;background:var(--neutral-light-300);display:inline-block"></span></div>
</div>
</div>
</body></html>
